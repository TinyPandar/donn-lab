pipeline: base
dataset: vehicle
model: measured_tm_scatter
data_root: data/dataset_dark_intersection_32k_spread_background_road/random

data:
  dataset: vehicle
  data_root: data/dataset_dark_intersection_32k_spread_background_road/random
  label_filter: person
  multiple_objects: false
  batch_size: 32
  max_train_batches: 0
  max_test_batches: 0
  h_in: 128
  w_in: 128
  h_out: 128
  w_out: 128
  input_mode: gray
  enable_aug: false
  zoom_crop_mode: none
  zoom_crop_factor: 1.0
  vis_samples: 6
  vehicle_channel_mode: rgb
  vehicle_channel: r
  vehicle_channel_invert: false
  vehicle_channel_p_low: 2.0
  vehicle_channel_p_high: 98.0
  vehicle_target_mode: center
  vehicle_target_column: box_mask

model_cfg:
  name: measured_tm_scatter
  num_layers: 5
  seed: 42
  activation: abs
  normalize_input: true
  # PNG gray values are the complex-field amplitude, not intensity.
  # Max-only normalization preserves the deliberately non-zero dark background.
  input_amplitude_normalization: max
  sqrt_amplitude: false
  # Fitted on held-out real-camera speckle pairs at 50 mW.
  detector_psf_sigma: 0.6
  phase_init: uniform
  tmatrix_scale: 1.0
  tmatrix_path: tm.npy
  tmatrix_dtype: complex64
  tmatrix_layout: out_in
  tmatrix_normalization: none
  tmatrix_compute_dtype: fp32
  return_intensity: true
  tmatrix_input_h: 0
  tmatrix_input_w: 0

optim:
  lr: 0.001
  epochs: 300
  save_every: 50

runtime:
  device: cuda:0
  amp: false
  amp_dtype: bf16

logging:
  log_dir: runs/logs
  ckpt_dir: runs/checkpoints
  comment: vehicle-dark-intersection-measured-tm-scatter

loss:
  name: pbr

clearml:
  enabled: false

output:
  run_name: vehicle-dark-intersection-measured-tm-scatter
